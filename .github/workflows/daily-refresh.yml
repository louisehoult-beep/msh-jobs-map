name: Daily jobs-map refresh

on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: jobs-map-pipeline-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The crawl cache drives incremental fetching (sitemap lastmod), so a
      # daily run only re-fetches what changed. It is ~1.6MB and would churn
      # every single day, so it lives in the Actions cache rather than in the
      # repo history.
      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: data/crawl-cache.json
          key: jobs-crawl-cache-${{ github.run_id }}
          restore-keys: |
            jobs-crawl-cache-

      - name: Install test dependencies
        run: pip install pytest

      - name: Run the test suites (gate, classification, dedupe, regions)
        run: python3 -m pytest test_verify.py test_classify.py test_dedupe.py test_regions.py -q

      - name: Build jobs-data.json
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scripts/build_jobs_data.py

      - name: Verify the built data before publishing
        run: python3 verify.py

      - name: Commit and push
        run: |
          set -euo pipefail
          # data/jobs-data.json is a GENERATED artifact. There is no meaningful
          # "merge" of two generations — the newest complete build wins. The
          # previous version rebased with -X theirs --autostash, which
          # line-merged the JSON and produced 314 jobs carrying a job_count of
          # 310 plus 4 duplicate ids. verify.py blocked that publish (correctly),
          # but the retry itself was the bug. Keep our build aside, reset to the
          # remote, put it back, re-verify, push.
          cp data/jobs-data.json "$RUNNER_TEMP/jobs-data.json"
          git config user.name "hub-jobs-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/jobs-data.json" data/jobs-data.json

            python3 verify.py

            git add data/jobs-data.json
            if git diff --cached --quiet; then
              echo "no change in the feed today"
              exit 0
            fi
            git commit -m "daily jobs-map refresh $(date -u +'%F')"

            if git push; then
              echo "published"
              exit 0
            fi
            echo "push rejected (someone else pushed); retrying ($attempt/3)"
            sleep 5
          done

          echo "push failed after 3 attempts"
          exit 1
