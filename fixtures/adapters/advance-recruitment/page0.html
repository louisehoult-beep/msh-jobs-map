ng to recruit an Inside Sales Executive to join their Sheffield-based team, supporting sales activity across the UK.</p>\r<h3>Why you should join</h3>\r<ul data-spread=\"false\">\r<li>\r<p>Join an established, successful healthcare company with a strong reputation and excellent staff retention.</p>\r</li>\r<li>\r<p>Become part of a close-knit, friendly and supportive team where people genuinely enjoy working together.</p>\r</li>\r<li>\r<p>Work with an approachable manager who encourages independence, trusts her team and doesn't micromanage.</p>\r</li>\r<li>\r<p>Enjoy a varied role combining sales, account management, business development and market research.</p>\r</li>\r<li>\r<p>Receive full product training, so previous medical device or healthcare experience isn't essential.</p>\r</li>\r<li>\r<p>Have the opportunity to develop your commercial skills and potentially progress into a field-based sales role.</p>\r</li>\r<li>\r<p>Join a growing team where you can take ownership of your work and make a genuine contribution to business growth.</p>\r</li>\r</ul>\r<h3>Job responsibilities</h3>\r<p>This is a varied, office-based sales position combining existing account management, proactive new business development and support for the external sales team. You will work across three product groups, breast care, orthotics and walking aids, helping to identify and develop opportunities throughout the UK.</p>\r<p>Your responsibilities will include:</p>\r<ul data-spread=\"false\">\r<li>\r<p>Proactively identifying and developing new business opportunities through telephone, email and digital engagement.</p>\r</li>\r<li>\r<p>Managing and developing relationships with existing customers, including NHS departments, private healthcare providers, clinics and distributors.</p>\r</li>\r<li>\r<p>Researching potential customers, mapping market opportunities and identifying areas for business growth.</p>\r</li>\r<li>\r<p>Following up sales leads, customer enquiries and marketing campaigns to convert opportunities into orders.</p>\r</li>\r<li>\r<p>Identifying cross-selling and upselling opportunities across the product portfolio.</p>\r</li>\r<li>\r<p>Supporting the external Territory Managers with prospecting, customer appointments and regional sales development.</p>\r</li>\r<li>\r<p>Preparing and following up quotations, pricing proposals and tender documentation.</p>\r</li>\r<li>\r<p>Maintaining and updating customer databases, ensuring accurate contact information and sales records.</p>\r</li>\r<li>\r<p>Assisting with product launches, training activities, promotional campaigns and events.</p>\r</li>\r<li>\r<p>Monitoring sales opportunities, tracking progress against targets and providing market and competitor intelligence.</p>\r</li>\r<li>\r<p>Working closely with customer service, marketing and operations to ensure customers receive a professional and responsive service.</p>\r</li>\r</ul>\r<h3>Person requirements</h3>\r<p>We are looking for a proactive, commercially minded individual who enjoys speaking with customers, developing relationships and finding new business opportunities. This role would particularly suit someone in the early stages of their sales career who is keen to take on more responsibility and develop within the healthcare industry.</p>\r<p><strong>Essential:</strong></p>\r<ul data-spread=\"false\">\r<li>\r<p>Previous experience in an internal sales, telesales, outbound sales or customer-facing sales role, ideally with at least 1-2 years' experience.</p>\r</li>\r<li>\r<p>Confident telephone manner with the ability to build rapport and develop customer relationships.</p>\r</li>\r<li>\r<p>A proactive approach to prospecting and identifying new sales opportunities.</p>\r</li>\r<li>\r<p>Strong communication, organisational and administrative skills.</p>\r</li>\r<li>\r<p>Self-motivated, resilient and comfortable working towards sales targets.</p>\r</li>\r<li>\r<p>Able to work independently, use initiative and manage competing priorities.</p>\r</li>\r<li>\r<p>Good IT skills, including Microsoft Office and Excel.</p>\r</li>\r<li>\r<p>Adaptable and comfortable working across different products, customers and sales approaches.</p>\r</li>\r</ul>\r<p><strong>Desirable:</strong></p>\r<ul data-spread=\"false\">\r<li>\r<p>Experience within healthcare, medical devices or a related industry.</p>\r</li>\r<li>\r<p>Knowledge of NHS customers, procurement or tender processes.</p>\r</li>\r<li>\r<p>Experience preparing quotations or supporting field-based sales teams.</p>\r</li>\r</ul>\r<p>Previous healthcare experience is not essential. More important is your enthusiasm for sales, willingness to learn and ability to take ownership of opportunities.</p>\r<h3>Salary and benefits</h3>\r<ul data-spread=\"false\">\r<li>\r<p><strong>Basic salary:</strong> &pound;27,000 - &pound;30,000</p>\r</li>\r<li><strong>Bonus potential:</strong> &pound;6,000</li>\r<li>\r<p><strong>Annual leave:</strong> 24 days plus bank holidays</p>\r</li>\r<li>\r<p><strong>Pension:</strong> Company pension scheme</p>\r</li>\r<li>\r<p><strong>Location:</strong> Sheffield, predominantly office-based with occasional customer travel</p>\r</li>\r<li>\r<p><strong>Training:</strong> Full product training and ongoing development</p>\r</li>\r<li>\r<p><strong>Career progression:</strong> Potential opportunity to move into an external sales position</p>\r</li>\r</ul>\r<p>&nbsp;</p>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Inside Sales Executive", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2027-04-18T14:18:41.406Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "inside-sales-executive-yorkshire-3694521-28251", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "Office based in Sheffield", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3694521", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-10-20T14:18:41.406Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "£27,000 - £30,000", "show": true, "sortOrder": -55}, "location": {"name": "County", "type": "Select", "value": "Yorkshire", "show": true, "sortOrder": -52}, "sector": {"name": "Sector", "type": "Select", "value": "Trainee", "show": true, "sortOrder": -50}}, "expired": false}, {"id": 28249, "seoTitle": "territory-sales-manager-airway-management-visualisation-south-thames-3690728-28249", "seoValues": {"keywords": "Territory Sales Manager - Airway Management & Visualisation recruitment, Territory Sales Manager - Airway Management & Visualisation vacancies, Territory Sales Manager - Airway Management & Visualisation vacancies", "description": "Territory Sales Manager - Airway Management & Visualisation Job; Location: South Thames", "header": "Territory Sales Manager - Airway Management & Visualisation", "title": "Territory Sales Manager - Airway Management & Visualisation Job in South Thames"}, "fieldValues": {"job_type": {"name": "Job type", "type": "Select", "value": "Permanent", "show": true, "sortOrder": -54}, "sdescr": {"name": "Short description", "type": "Textarea", "value": "Take ownership of an established South East territory, promoting market-leading video laryngoscopy and airway management systems. Drive new business across theatres and critical care, with excellent earning potential, uncapped commission and opportunities for career development.", "show": false, "sortOrder": -46}, "country": {"name": "Google Country", "type": "Select", "value": "United Kingdom", "show": false, "sortOrder": 69}, "meta_image": {"name": "Meta Image", "type": "File", "value": "-", "show": false, "sortOrder": 77}, "google_street": {"name": "Google Street Address", "type": "Text", "value": "-", "show": false, "sortOrder": 72}, "description": {"name": "Job advert text", "type": "Wysiwyg", "value": "<p><strong>Location: </strong>Sussex, Kent, Surrey, Hampshire &amp; the South Coast including Dartford, Medway, Canterbury, Tunbridge, Brighton, Portsmouth, Southampton, Reading, Guildford, Redhill.</p>\r<p>You'll need to live within or close to the territory and be comfortable travelling regularly to customer sites.</p>\r<p><strong>Products:</strong> Video laryngoscopy, bronchoscopy and airway management systems</p>\r<h2>Who you'll be working for</h2>\r<p>A global medical device manufacturer and recognised market leader in video laryngoscopy, providing innovative technologies that help clinicians improve patient care.</p>\r<p>The company specialises in advanced visualisation and airway management solutions, including video laryngoscopes and single-use bronchoscopes used across critical care, anaesthesia and operating theatres.</p>\r<p>With an established reputation, a growing respiratory and pulmonology portfolio and a strong commitment to product innovation, the business offers an exciting opportunity to join a successful and expanding team.</p>\r<h2>Why should you join?</h2>\r<ul>\r<li>\r<p><strong>Market-leading products:</strong> Represent the global market leader in video laryngoscopy, with an established customer base and a growing portfolio of airway management solutions.</p>\r</li>\r<li>\r<p><strong>Excellent earning potential:</strong> Uncapped monthly commission with accelerators once you exceed target, providing genuine opportunities to increase your earnings.</p>\r</li>\r<li>\r<p><strong>Career development:</strong> Comprehensive product training, ongoing professional development and opportunities for internal progression.</p>\r</li>\r<li>\r<p><strong>Supportive team culture:</strong> Join a close-knit, collaborative team that regularly gets together for company events, celebrations and team-building activities.</p>\r</li>\r<li>\r<p><strong>Employee wellbeing:</strong> A company that values work-life balance, employee engagement and wellbeing, with a comprehensive benefits package.</p>\r</li>\r</ul>\r<h2>The role</h2>\r<p>As Territory Sales Manager, you'll take responsibility for developing and growing sales of a market-leading range of video laryngoscopy and bronchoscopy systems across the South East.</p>\r<p>This is a customer-facing role combining new business development with account management. You'll work closely with clinicians and hospital decision-makers, demonstrating how the company's technology can improve clinical workflows and patient care.</p>\r<p>Your responsibilities will include:</p>\r<ul>\r<li>\r<p>Managing and developing an established territory, identifying opportunities to grow existing accounts and win new business.</p>\r</li>\r<li>\r<p>Building strong relationships with anaesthetists, surgeons, theatre teams, critical care clinicians, nursing staff and senior hospital decision-makers.</p>\r</li>\r<li>\r<p>Conducting product demonstrations, evaluations and presentations to demonstrate the clinical and commercial benefits of the portfolio.</p>\r</li>\r<li>\r<p>Identifying new business opportunities through proactive prospecting and regular face-to-face customer engagement.</p>\r</li>\r<li>\r<p>Managing the full sales process, from initial engagement and product evaluation through to proposals, negotiations and closing sales.</p>\r</li>\r<li>\r<p>Developing territory business plans, maintaining an accurate sales pipeline and working towards monthly, quarterly and annual targets.</p>\r</li>\r<li>\r<p>Working with clinical and commercial stakeholders to understand their challenges and provide appropriate solutions.</p>\r</li>\r</ul>\r<h2>Who we're looking for</h2>\r<p>We're looking for a driven, ambitious and commercially minded individual who enjoys being out in front of customers and has the motivation to develop new business.</p>\r<p>You don't need previous airway management experience, as comprehensive product training will be provided.</p>\r<p>Ideally, you'll bring:</p>\r<ul>\r<li>\r<p>Some field sales experience, preferably within medical devices, healthcare or another B2B environment.</p>\r</li>\r<li>\r<p>Experience selling into operating theatres, anaesthesia or critical care would be advantageous, but isn't essential.</p>\r</li>\r<li>\r<p>An understanding of capital equipment sales or experience managing product evaluations would be beneficial.</p>\r</li>\r<li>\r<p>Confidence building relationships with clinical and commercial decision-makers.</p>\r</li>\r<li>\r<p>A proactive, competitive approach to sales, with the resilience and determination to pursue new opportunities.</p>\r</li>\r<li>\r<p>Strong organisational skills and the ability to manage your own territory, priorities and sales pipeline.</p>\r</li>\r<li>\r<p>Excellent communication and presentation skills, with the ability to influence customers at different levels.</p>\r</li>\r</ul>\r<p><strong>We're also interested in hearing from people earlier in their sales careers</strong>, including Associate Sales Representatives who are ready to take on their own territory. If you're a self-starter with the drive to succeed, the company is willing to invest in your development.</p>\r<h2>Salary &amp; Benefits</h2>\r<ul>\r<li>\r<p><strong>Basic salary:</strong> &pound;45,000&ndash;&pound;58,000 depending on experience.</p>\r</li>\r<li>\r<p><strong>Bonus:</strong> Uncapped commission based on sales, paid monthly, with accelerators above 100% of target.</p>\r</li>\r<li>\r<p><strong>Company car or car allowance:</strong> &pound;650 per month (&pound;7,800 annually).</p>\r</li>\r<li>\r<p><strong>Pension:</strong> 4% employer contribution with 5% employee contribution through salary sacrifice.</p>\r</li>\r<li>\r<p><strong>Private healthcare:</strong> AXA.</p>\r</li>\r<li>\r<p><strong>Health cash plan:</strong> Simplyhealth, providing support towards dental, GP, chiropractic and other healthcare costs.</p>\r</li>\r<li>\r<p><strong>Additional benefits:</strong> Paid leave, family and medical leave provisions, employee wellbeing initiatives and professional development opportunities.</p>\r</li>\r</ul>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Territory Sales Manager - Airway Management & Visualisation", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2027-04-11T11:05:57.879Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "territory-sales-manager-airway-management-visualisation-south-thames-3690728-28249", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "South East", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3690728", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-10-13T11:05:57.879Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "£45,000 - £58,000", "show": true, "sortOrder": -55}, "location": {"name": "County", "type": "Select", "value": "South Thames", "show": true, "sortOrder": -52}, "sector": {"name": "Sector", "type": "Select", "value": "Healthcare", "show": true, "sortOrder": -50}}, "expired": false}, {"id": 28248, "seoTitle": "regional-sales-manager-orthopaedic-power-tools-south-thames-3667023-28248", "seoValues": {"keywords": "Regional Sales Manager – Orthopaedic Power Tools recruitment, Regional Sales Manager – Orthopaedic Power Tools vacancies, Regional Sales Manager – Orthopaedic Power Tools vacancies", "description": "Regional Sales Manager – Orthopaedic Power Tools Job; Location: South Thames", "header": "Regional Sales Manager – Orthopaedic Power Tools", "title": "Regional Sales Manager – Orthopaedic Power Tools Job in South Thames"}, "fieldValues": {"job_type": {"name": "Job type", "type": "Select", "value": "Permanent", "show": true, "sortOrder": -54}, "sdescr": {"name": "Short description", "type": "Textarea", "value": "Take ownership of an established South Thames territory selling specialist orthopaedic power tools into hospitals. An excellent opportunity for someone ready to step up into full territory responsibility, with uncapped commission, a company car and strong development potential.", "show": false, "sortOrder": -46}, "country": {"name": "Google Country", "type": "Select", "value": "United Kingdom", "show": false, "sortOrder": 69}, "meta_image": {"name": "Meta Image", "type": "File", "value": "-", "show": false, "sortOrder": 77}, "google_street": {"name": "Google Street Address", "type": "Text", "value": "-", "show": false, "sortOrder": 72}, "description": {"name": "Job advert text", "type": "Wysiwyg", "value": "<div class=\"qMYqUG_convSearchResultHighlightRoot\">\r<div class=\"\" data-turn-id-container=\"request-6ab24ab4-2190-83eb-a302-80066ab866fc-0\" data-is-intersecting=\"true\">\r<section class=\"text-token-text-primary w-full focus:outline-none has-data-writing-block:pointer-events-none [&amp;:has([data-writing-block])&gt;*]:pointer-events-auto R6Vx5W_threadScrollVars scroll-mb-[calc(var(--scroll-root-safe-area-inset-bottom,0px)+var(--thread-response-height))] scroll-mt-[calc(var(--header-height)+min(200px,max(70px,20svh)))]\" dir=\"auto\" data-turn-id=\"request-6ab24ab4-2190-83eb-a302-80066ab866fc-0\" data-turn-id-container=\"request-6ab24ab4-2190-83eb-a302-80066ab866fc-0\" data-testid=\"conversation-turn-12\" data-turn=\"assistant\">\r<div \">Who you&rsquo;ll be working for:</strong></p>\r<p dir=\"auto\" data-start=\"428\" data-end=\"544\">A privately owned, family-run medical device manufacturer with more than 100 years of history and a global presence.</p>\r<p dir=\"auto\" data-start=\"546\" data-end=\"813\">The company specialises in surgical power tools and has built its reputation around world-class products backed by strong customer service. Unlike many larger orthopaedic companies, it does not manufacture implants &ndash; surgical power tools are the core of the business.</p>\r<p dir=\"auto\" data-start=\"815\" data-end=\"1041\">The company takes a long-term approach to both its customers and its people, with fewer corporate layers, accessible senior management and considerable emphasis on personal responsibility.</p>\r<p dir=\"auto\" data-start=\"1043\" data-end=\"1067\"><strong data-start=\"1043\" data-end=\"1065\">What you&rsquo;ll enjoy:</strong></p>\r<ul data-start=\"1069\" data-end=\"1983\">\r<li data-section-id=\"1l06viz\" data-start=\"1069\" data-end=\"1203\">Taking genuine ownership of your own medical sales territory, with responsibility for the accounts, activity and commercial results.</li>\r<li data-section-id=\"vd2rdm\" data-start=\"1204\" data-end=\"1302\">Inheriting existing customer relationships while having plenty of scope to develop new business.</li>\r<li data-section-id=\"w7jzv5\" data-start=\"1303\" data-end=\"1407\">Selling a specialist product portfolio where you can develop genuine technical and clinical expertise.</li>\r<li data-section-id=\"1lf60rq\" data-start=\"1408\" data-end=\"1477\">A mix of capital equipment sales and recurring disposable business.</li>\r<li data-section-id=\"bqy0ri\" data-start=\"1478\" data-end=\"1561\">Working directly with surgeons, theatre teams and other healthcare professionals.</li>\r<li data-section-id=\"1lbctfz\" data-start=\"1562\" data-end=\"1681\">The freedom to plan and manage your own diary, while still being part of an established and supportive UK sales team.</li>\r<li data-section-id=\"h11ao\" data-start=\"1682\" data-end=\"1781\">Joining a growing, family-owned manufacturer with opportunities to develop your career over time.</li>\r<li data-section-id=\"133r2m4\" data-start=\"1782\" data-end=\"1983\">An uncapped commission scheme with existing business on the territory and no threshold before you start earning commission.</li>\r</ul>\r<p dir=\"auto\" data-start=\"1985\" data-end=\"2012\"><strong data-start=\"1985\" data-end=\"2010\">What you&rsquo;ll be doing:</strong></p>\r<ul data-start=\"2014\" data-end=\"2836\">\r<li data-section-id=\"lfcs80\" data-start=\"2014\" data-end=\"2101\">Managing and developing existing hospital accounts across the South Thames territory.</li>\r<li data-section-id=\"14nibal\" data-start=\"2102\" data-end=\"2202\">Identifying and winning new business with hospitals where there is scope to increase market share.</li>\r<li data-section-id=\"53s31l\" data-start=\"2203\" data-end=\"2320\">Building relationships with surgeons, ODPs, theatre managers, nursing teams, procurement and other decision-makers.</li>\r<li data-section-id=\"1dqgan2\" data-start=\"2321\" data-end=\"2415\">Identifying capital replacement opportunities and developing them through the sales process.</li>\r<li data-section-id=\"ieqqm5\" data-start=\"2416\" data-end=\"2485\">Carrying out product demonstrations, evaluations and user training.</li>\r<li data-section-id=\"1n0zpli\" data-start=\"2486\" data-end=\"2540\">Preparing quotations and supporting tender activity.</li>\r<li data-section-id=\"1t63onx\" data-start=\"2541\" data-end=\"2630\">Developing ongoing disposable sales from customers already using the company&rsquo;s systems.</li>\r<li data-section-id=\"1s1bmo3\" data-start=\"2631\" data-end=\"2719\">Planning your territory, managing your pipeline and deciding where to focus your time.</li>\r<li data-section-id=\"v6tpwk\" data-start=\"2720\" data-end=\"2836\">Travelling regularly between hospitals and customer sites across the region.</li>\r</ul>\r<p dir=\"auto\" data-start=\"2838\" data-end=\"2865\"><strong data-start=\"2838\" data-end=\"2863\">Here&rsquo;s what you need:</strong></p>\r<p dir=\"auto\" data-start=\"2867\" data-end=\"3144\">There are several backgrounds that could work well for this opportunity. You might already be in medical device sales and ready to take ownership of your own territory, or be working as a Sales Associate or Clinical Specialist and looking for greater commercial responsibility.</p>\r<p dir=\"auto\" data-start=\"3146\" data-end=\"3443\">Alternatively, you could come from a clinical background such as an ODP, scrub nurse, theatre practitioner, theatre manager or physiotherapist. There may also be potential for someone with advanced scientific or postgraduate education who is genuinely motivated to build a career in medical sales.</p>\r<p dir=\"auto\" data-start=\"3445\" data-end=\"3483\">Whatever your background, you&rsquo;ll need:</p>\r<ul data-start=\"3485\" data-end=\"4029\">\r<li data-section-id=\"1ehkb4z\" data-start=\"3485\" data-end=\"3541\">Strong communication and relationship-building skills.</li>\r<li data-section-id=\"1dtll3o\" data-start=\"3542\" data-end=\"3610\">The credibility to work effectively with healthcare professionals.</li>\r<li data-section-id=\"1bs04p8\" data-start=\"3611\" data-end=\"3691\">Commercial drive and a genuine interest in sales and new business development.</li>\r<li data-section-id=\"1gngigh\" data-start=\"3692\" data-end=\"3764\">The ability to organise yourself and manage a territory independently.</li>\r<li data-section-id=\"1l0wb0m\" data-start=\"3765\" data-end=\"3843\">Resilience and the confidence to deal with setbacks and changing priorities.</li>\r<li data-section-id=\"1xrlqq3\" data-start=\"3844\" data-end=\"3896\">A practical, customer-focused and can-do approach.</li>\r<li data-section-id=\"1skjylr\" data-start=\"3897\" data-end=\"4029\">The motivation to work tow ly curious and opportunity-led approach.</p>\r</li>\r<li>\r<p>The confidence to challenge customers constructively and overcome objections.</p>\r</li>\r<li>\r<p>The independence and resilience to operate successfully within a lean, entrepreneurial organisation.</p>\r</li>\r<li>\r<p>Good CRM and Microsoft Office skills. Salesforce experience would be advantageous.</p>\r</li>\r<li>\r<p>Willingness to travel extensively throughout Scotland.</p>\r</li>\r</ul>\r<p><strong>Basic salary:</strong> &pound;50,000</p>\r<p><strong>Bonus/commission:</strong> Target earnings equivalent to 40% of basic salary, structured across monthly, quarterly and annual components. Monthly commission starts at 85% of sales plan, with performance capped at 225%. Quarterly bonus is capped at 100% and year-end bonus at 120% of plan.</p>\r<p><strong>Pension:</strong> 4% employer contribution.</p>\r<p><strong>Holiday:</strong> 25 days plus bank holidays.</p>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Territory Manager – Vascular", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2027-03-21T11:34:23.836Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "territory-manager-vascular-scotland-3613960-28243", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "Scotland", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3613960", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-09-22T11:34:23.836Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "£50,000",
