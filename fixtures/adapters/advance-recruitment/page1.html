ing sits at the heart of the organisation's strategy and expertise, with leading positions across:</p>\r<ul>\r<li>CT contrast media</li>\r<li>MRI contrast media</li>\r<li>Contrast Enhanced Ultrasound (CEUS)</li>\r<li>Nuclear medicine</li>\r<li>Advanced imaging technologies</li>\r</ul>\r<p>Operating in more than 100 countries, the business continues to invest significantly in research, innovation and clinical education, supporting improvements in diagnostic pathways and patient outcomes across healthcare systems globally.</p>\r<p><strong>What you&rsquo;ll enjoy:</strong></p>\r<ul>\r<li>You'll be part of a close-knit team, where everyone mucks in together.</li>\r<li>An agile business with open communication channels making it straightforward to get things done.</li>\r<li>You'll have a supportive manager, who really looks out for her team.</li>\r<li>It's an autonomous working culture with no micromanagement!</li>\r<li>Competitive package with bonus scheme which you'll be eligible for immediately.</li>\r</ul>\r<p><strong>What you&rsquo;ll be doing: </strong></p>\r<ul>\r<li>We're looking for an Account Manager to join the company's radiology team, managing a strategically important territory covering North West England and Yorkshire.</li>\r<li>This is a highly varied role combining account management, business development, product launches and strategic territory planning. You'll work with NHS and private healthcare customers across the company's radiology portfolio, including CT contrast media, MRI contrast media, injector systems, consumables and service solutions.</li>\r<li>A key focus will be growing and protecting the company's CT injector business, supporting customers through the transition to the next-generation injector platform, driving adoption of the MRI portfolio and identifying opportunities to expand utilisation across existing and new accounts.</li>\r<li>You'll build relationships with radiologists, radiographers, procurement teams, CT leads and other key stakeholders, helping customers improve diagnostic imaging services whilst delivering sustainable commercial growth across the territory.</li>\r</ul>\r<p><strong>Here&rsquo;s what you need: </strong></p>\r<p>We're interested in commercially driven individuals who can build strong customer relationships, manage complex NHS sales environments and identify opportunities for growth.</p>\r<p>Particularly relevant backgrounds include:</p>\r<ul>\r<li>Radiology sales.</li>\r<li>Medical imaging sales.</li>\r<li>Contrast media sales.</li>\r<li>Capital equipment sales.</li>\r<li>Clinical specialist or applications specialist roles with commercial exposure.</li>\r<li>Radiography, particularly CT or MRI experience.</li>\r</ul>\r<p>Experience selling into radiology departments, knowledge of NHS procurement and tendering processes, and familiarity with MRI, CT imaging or imaging devices would be highly advantageous.</p>\r<p>You will also ideally have:</p>\r<ul>\r<li>Experience within healthcare, medical devices, pharmaceuticals or diagnostic imaging sales.</li>\r<li>Strong account management and business development experience.</li>\r<li>Experience managing NHS sales cycles involving multiple stakeholders.</li>\r<li>A proven track record of achieving sales targets and growing accounts.</li>\r<li>Excellent territory planning and organisational skills.</li>\r<li>Strong communication, negotiation and stakeholder management abilities.</li>\r</ul>\r<p>We're looking for someone with a strong work ethic who enjoys building long-term relationships, works well autonomously and thrives within a collaborative team environment. You'll be commercially minded, proactive, resilient and motivated by the opportunity to develop a strategically important territory.</p>\r<p><strong>Salary:</strong> c&pound;56,000</p>\r<p><strong>Bonus</strong>: c&pound;15,000</p>\r<p><strong>Car policy</strong>: Car allowance</p>\r<p><strong>Benefits</strong>: Pension (9% employer contribution), life assurance, private medical cover (following probationary period), gym membership</p>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Account Manager - Radiology", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2026-12-09T00:00:00Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "account-manager-radiology-north-west-north-wales-3667743", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "North West & Yorkshire", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3667743", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-09-10T13:19:00Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "c£56,000 + £15k bonus", "show": true, "sortOrder": -55}, "location": {"name": "County", "type": "Select", "value": "North West/North Wales", "show": true, "sortOrder": -52}, "sector": {"name": "Sector", "type": "Select", "value": "Healthcare", "show": true, "sortOrder": -50}}, "expired": false}, {"id": 28238, "seoTitle": "territory-manager-x-ray-South-West-3658584-28237", "seoValues": {"keywords": "Territory Manager – X-Ray recruitment, Territory Manager – X-Ray vacancies, Territory Manager – X-Ray vacancies", "description": "Territory Manager – X-Ray Job; Location: South West/South Wales", "header": "Territory Manager – X-Ray", "title": "Territory Manager – X-Ray Job in South West/South Wales"}, "fieldValues": {"job_type": {"name": "Job type", "type": "Select", "value": "Permanent", "show": true, "sortOrder": -54}, "sdescr": {"name": "Short description", ed paid sick leave as your length of service grows.</li>\r<li>Wellbeing &ndash; Externally trained Mental Health First Aiders, confidential 24/7 EAP mental health support for employees and their household, plus flu/hepatitis B vaccination costs covered.</li>\r<li>Eye Tests/Glasses &ndash; Full cost of an eye test every two years, plus an additional &pound;70 towards eyewear.</li>\r<li>Cycle Scheme &ndash; Cycle to Work Scheme to support active travel and wellbeing.</li>\r<li>PHI Scheme &ndash; Permanent Health Insurance providing support if you're unable to work due to illness or injury.</li>\r<li>Pension &ndash; 5% employer pension contribution, rather than the legal minimum of 4%.</li>\r<li>Life Assurance &ndash; Four times your annual salary paid to your nominated person(s) in the event of your death.</li>\r<li>Long Service Awards &ndash; A special gift for every five years of employment.</li>\r<li>&pound;5 lunch allowance</li>\r</ul>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Territory Manager - Critical Care", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2026-11-30T00:00:00Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "territory-manager-critical-care-south-west-south-wales-3629359-28235", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "South West, Wales, South Midlands", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3629359", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-09-01T14:49:00Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "£30,000 - £45,000", "show": true, "sortOrder": -55}, "location": {"name": "County", "type": "Select", "value": "South West/South Wales", "show": true, "sortOrder": -52}, "sector": {"name": "Sector", "type": "Select", "value": "Trainee", "show": true, "sortOrder": -50}}, "expired": false}, {"id": 28234, "seoTitle": "senior-sales-representative-account-manager-international-3605529-28234", "seoValues": {"keywords": "Senior Sales Representative / Account Manager recruitment, Senior Sales Representative / Account Manager vacancies, Senior Sales Representative / Account Manager vacancies", "description": "Senior Sales Representative / Account Manager Job; Location: International", "header": "Senior Sales Representative / Account Manager", "title": "Senior Sales Representative / Account Manager Job in International"}, "fieldValues": {"job_type": {"name": "Job type", "type": "Select", "value": "Permanent", "show": true, "sortOrder": -54}, "sdescr": {"name": "Short description", "type": "Textarea", "value": "A global medical education technology company specialising in advanced 3D anatomy and simulation solutions is seeking a Senior Sales Representative to support growth across the DACH region", "show": false, "sortOrder": -46}, "country": {"name": "Google Country", "type": "Select", "value": "United Kingdom", "show": false, "sortOrder": 69}, "meta_image": {"name": "Meta Image", "type": "File", "value": "-", "show": false, "sortOrder": 77}, "google_street": {"name": "Google Street Address", "type": "Text", "value": "-", "show": false, "sortOrder": 72}, "description": {"name": "Job advert text", "type": "Wysiwyg", "value": "<p><strong>Location: </strong>Germany-based.</p>\r<p>Covering all of Germany and wider DACH, including Austria and part of Switzerland. Germany is more than 90% of the market. Travel expected across Germany, wider DACH as needed, and quarterly meetings in Milan. Ideally near a major hub such as Berlin, Hamburg, D&uuml;sseldorf / Ruhr, Frankfurt, Munich.</p>\r<p><strong>Product: </strong>Market leading products for advanced 3D medical visualisation technology, specialising in digitising real human bodies into fully interactive digital cadavers. The portfolio also includes Theatre immersive teaching environments, portable tablet platforms, virtual lessons, and broader anatomy education software solutions used across medical, healthcare, allied health, and STEM education.</p>\r<p><strong>&nbsp;</strong><strong>Who you&rsquo;ll be working for:</strong>&nbsp;</p>\r<div class=\"qMYqUG_convSearchResultHighlightRoot\">\r<div class=\"\" data-turn-id-container=\"request-69fa0282-b4d8-838d-8776-57d832fd2e57-4\" data-is-intersecting=\"true\">\r<div class=\"relative w-full overflow-visible\">\r<section class=\"text-token-text-primary w-full focus:outline-none [--shadow-height:45px] has-data-writing-block:pointer-events-none has-data-writing-block:-mt-(--shadow-height) has-data-writing-block:pt-(--shadow-height) [&amp;:has([data-writing-block])&gt;*]:pointer-events-auto R6Vx5W_threadScrollVars scroll-mb-[calc(var(--scroll-root-safe-area-inset-bottom,0px)+var(--thread-response-height))] scroll-mt-[calc(var(--header-height)+min(200px,max(70px,20svh)))]\" dir=\"auto\" data-turn-id=\"request-69fa0282-b4d8-838d-8776-57d832fd2e57-4\" data-turn-id-container=\"request-69fa0282-b4d8-838d-8776-57d832fd2e57-4\" data-testid=\"conversation-turn-44\" data-scroll-anchor=\"false\" data-turn=\"assistant\">\r<div class=\"text-base my-auto mx-auto pb-10 [--thread-content-margin:var(--thread-content-margin-xs,calc(var(--spacing)*4))] @w-sm/main:[--thread-content-margin:var(--thread-content-margin-sm,calc(var(--spacing)*6))] @w-lg/main:[--thread-content-margin:var(--thread-content-margin-lg,calc(var(--spacing)*16))] px-(--thread-content-margin)\">\r<div class=\"[--thread-content-max-width:40rem] @w-lg/main:[--thread-content-max-width:48rem] mx-auto max-w-(--thread-content-max-width) flex-1 group/turn-messages focus-visible:outline-hidden relative flex w-full min-w-0 flex-col agent-turn\">\r<div class=\"flex max-w-full flex-col gap-4 grow\">\r<div data-message-author-role=\"assistant\" data-message-id=\"0c6587af-a037-4898-b258-d3219fba530e\" dir=\"auto\" data-message-model-slug=\"gpt-5-5\" class=\"min-h-8 text-message relative flex w-full flex-col items-end gap-2 text-start break-words whitespace-normal outline-none keyboard-focused:focus-ring [.text-message+&amp;]:mt-1\" data-turn-start-message=\"true\" tabindex=\"0\">\r<div class=\"flex w-full flex-col gap-1 empty:hidden\">\r<div class=\"markdown prose dark:prose-invert wrap-break-word w-full light markdown-new-styling\">\r<p data-start=\"0\" data-end=\"360\">Our client is a globally recognised medical technology company specialising in advanced 3D visualisation and simulation solutions used across healthcare and education. Their technology supports universities, hospitals, simulation centres, and allied health programmes by transforming how anatomy, clinical training, and STEM subjects are taught and understood.</p>\r<p data-start=\"362\" data-end=\"808\">With a strong international presence and continued investment in innovation, the business is experiencing significant growth across Europe and the UK. Their portfolio includes immersive teaching environments, interactive digital anatomy platforms, and broader educational software solutions designed to modernise learning and improve engagement across multiple disciplines including medicine, nursing, physiotherapy, midwifery, and life sciences.</p>\r<p data-start=\"810\" data-end=\"1038\" data-is-last-node=\"\" data-is-only-node=\"\">The company offers a collaborative, mission-driven culture with strong support for professional development, making it an excellent opportunity for individuals looking to build a long-term career within medical technology sales.</p>\r</div>\r</div>\r</div>\r</div>\r</div>\r</div>\r</section>\r</div>\r</div>\r</div>\r<p><strong>What you&rsquo;ll enjoy:</strong></p>\r<ul>\r<li><strong>Impactful Products:</strong> The company offers products with a strong \"wow\" effect, such as an \"immersive theatre,\" which quickly captivates potential customers.</li>\r<li><strong>Global leader </strong>in advanced 3D medical visualisation technology.</li>\r<li><strong>Strong Sales Support:</strong> The sales team receives strong support through the availability of diverse products (tablets, lessons) and the company's responsiveness to feedback.</li>\r<li><strong>Organic Growth Environment:</strong> Management listens to high-performing individuals for career progression, fostering an environment with strong opportunities for long-term roles.</li>\r<li><strong>Opportunity </strong>to build the market rather than inherit a fixed account list.</li>\r<li><strong>Significant Growth Opportunities:</strong> Anatomage Europe is experiencing significant growth, including the opening of a UK branch and the German market is huge and still untapped.</li>\r<li><strong>Mission-Driven Culture:</strong> 80-90% of the team believes in the company's mission to impact lives and education, with a light-hearted and fun team culture.</li>\r<li><strong>Ethical and Job-Oriented Mindset:</strong> The company values an ethical, job-oriented mindset where work is seen as fundamental to one's life.</li>\r</ul>\r<p><strong>What you&rsquo;ll be doing: </strong></p>\r<p>This is primarily a new business and market development role, with Germany being an underpenetrated market for the company. There are existing customers and some inbound / marketing-generated leads, but to be successful in the role you cannot rely on those alone. You will need to build contacts, develop new customers, create referrals, qualify opportunities, and grow awareness across universities, hospitals, simulation centres, high schools, allied health, and medical education environments.</p>\r<p>The role involves high-value, project-based, consultative sales rather than consumables or pure account management. Sales can be around &euro;100,000, with products ranging from a few hundred euros up to &euro;200,000+.</p>\r<p>Stakeholders selling to:</p>\r<ul>\r<li>Universities: Deans, Heads of Departments, Professors in Health Sciences, Allied Health, Medicine, and Life Sciences departments.</li>\r<li>Colleges: Curriculum Managers, Governors, Heads of Schools, Principals.</li>\r<li>Hospitals: Simulation Centre managers, Clinical Directors of specific departments</li>\r<li>Higher-Level Policymakers: Individuals managing multiple colleges or regional educational groups (e.g., Greater Manchester College Group) are highly influential decision-makers.</li>\r<li>The company has also sold to medical device manufacturers for training sales teams, customers (doctors), and showcasing devices at trade shows.</li>\r</ul>\r<p><strong>Here&rsquo;s what you need:</strong></p>\r<ul>\r<li>Minimum 3 years medical/scientific/education related sales experience.</li>\r<li>Genuine salesperson mindset.</li>\r<li>New business development experience.</li>\r<li>Ability to build a territory / market from low penetration.</li>\r<li>Ideally project-based or high-value sales experience.</li>\r<li>Consultative, multi-stakeholder selling experience.</li>\r<li>Able to sell into clinical, medical, healthcare, education, university, hospital, simulation centre, or allied health environments.</li>\r<li>Strong organisation, focus, follow-up, and CRM discipline.</li>\r<li>Persistent and persuasive without feeling intrusive.</li>\r<li>Able to qualify opportunities properly.</li>\r<li>Self-starter, reliable, and able to work independently across a distributed European team.</li>\r<li>Collaborative, communicative, and open to strategy / marketing / management support.</li>\r<li><strong>German speaker with strong English language skills.</strong></li>\r</ul>\r<p>Nice to have/will also consider:</p>\r<ul>\r<li>Research equipment sales, e.g. microscopes / electronic microscopes.</li>\r<li>CapEx equipment sales into universities or educational establishments</li>\r<li>Medical education sales.</li>\r<li>Medical courses / healthcare education background.</li>\r<li>Publishing background selling into the same customer base.</li>\r<li>Traditional medical device sales, if equipment-based, new-business-led probably in SME, marketing building environments and not pure account management.</li>\r</ul>\r<p><strong>Salary:</strong> to &euro;75,000 depending on experience</p>\r<p><strong>Bonus</strong>: total package &euro;100,000 &ndash; &euro;125,000 (approximately 60% basic salary / 40% commission)</p>\r<p><strong>Car policy</strong>: Company car or car allowance</p>\r<p><strong>Benefits</strong>: Normal German contract through German payroll office. Taxes, contributions, benefits, and required insurance paid in Germany. Laptop. Phone. German mobile phone plan.</p>", "show": false, "sortOrder": -42}, "title": {"name": "Job Title", "type": "Title", "value": "Senior Sales Representative / Account Manager", "show": false, "sortOrder": -56}, "expiration_date": {"name": "Expiration date", "type": "Expired Date", "value": "2026-11-30T14:47:42.213Z", "show": false, "sortOrder": -22}, "seo_title": {"name": "SEO Title", "type": "SEO Title", "value": "senior-sales-representative-account-manager-international-3605529-28234", "show": false, "sortOrder": 46}, "town_city": {"name": "Town/City", "type": "Text", "value": "Germany / DACH", "show": true, "sortOrder": -53}, "ref": {"name": "Job ref", "type": "Text", "value": "3605529", "show": true, "sortOrder": -48}, "post_date": {"name": "Post Date", "type": "Post Date", "value": "2026-09-01T14:47:42.213Z", "show": true, "sortOrder": -22}, "draft": {"name": "Draft", "type": "Draft", "value": "-", "show": false, "sortOrder": 50}, "google_postal_code": {"name": "Google Post Code", "type": "Text", "value": "-", "show": false, "sortOrder": 74}, "exact_salary": {"name": "Salary/Rate", "type": "Text", "value": "to €75,000", "show
